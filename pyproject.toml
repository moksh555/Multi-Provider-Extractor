[project]
name = "document-classifier"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Moksh Vaghasia", email = "57554299+moksh555@users.noreply.github.com" }
]
requires-python = ">=3.13"
dependencies = [
    "anthropic>=2.12.0",
    "langsmith>=0.16.0",
    "openai>=3.57.0",
    "opentelemetry-exporter-otlp>=1.45.2",
    "opentelemetry-instrumentation-anthropic>=0.63.1",
    "opentelemetry-sdk>=1.45.2",
    "pydantic-settings>=2.16.3",
    "pymupdf>=2.1",
]

[project.scripts]
document-classifier = "document_classifier:main"

[build-system]
requires = ["uv_build>=0.12.17,<0.13.0"]
build-backend = "uv_build"
